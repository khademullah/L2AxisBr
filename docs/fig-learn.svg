  <rect width="1000" height="280" fill="#fefbf2"/>
  <style>
    .s { font-family: "Segoe UI", Calibri, sans-serif; fill: #1a2744; }
    .m { font-family: ui-monospace, Consolas, monospace; fill: #1a2744; }
    .d { fill: #4d5870; }
  </style>
  <rect x="40" y="70" width="340" height="140" fill="#fffdf8" stroke="#1a2744"/>
  <text x="64" y="120" class="s" font-size="22">Host A source</text>
  <text x="64" y="164" class="m" font-size="22">02:00:00:00:00:01</text>
  <line x1="390" y1="140" x2="500" y2="140" stroke="#1a2744" stroke-width="2"/>
  <polygon points="500,140 486,132 486,148" fill="#1a2744"/>
  <text x="400" y="124" class="s" font-size="18">populate</text>
